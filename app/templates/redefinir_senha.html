<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --cor-primaria: {{ config_sistema.cor_primaria }};
            --cor-secundaria: {{ config_sistema.cor_secundaria }};
        }

        body {
            background: radial-gradient(circle at top left, #f8fbff 0%, #eef3f9 45%, #e6edf6 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        .card-reset {
            max-width: 420px;
            margin: auto;
            margin-top: 10vh;
            border-radius: 16px;
            border: 1px solid #dbe4ee;
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .card-reset::before {
            content: "";
            display: block;
            height: 4px;
            background: linear-gradient(90deg, var(--cor-primaria), var(--cor-secundaria));
        }

        .card-body {
            padding: 28px;
        }

        .title {
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group-text {
            background: #f8fafc;
            border: 1px solid #dbe4ee;
            border-right: 0;
        }

        .form-control {
            border: 1px solid #dbe4ee;
            border-left: 0;
            background: #f8fafc;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--cor-primaria);
            box-shadow: none;
        }

        .btn-reset {
            background: linear-gradient(90deg, var(--cor-primaria), var(--cor-secundaria));
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .btn-reset:hover {
            background: linear-gradient(90deg, var(--cor-secundaria), var(--cor-primaria));
        }
    </style>
</head>

<body>

<div class="card card-reset">
    <div class="card-body">

        <div class="title">
            <i class="bi bi-shield-lock me-2"></i>
            Redefinir Senha
        </div>

        <form method="POST" action="/salvar-nova-senha">

            <input type="hidden" name="token" value="{{ token }}">

            <!-- Nova senha -->
            <label class="form-label">Nova senha</label>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                </span>
                <input type="password" name="senha" class="form-control" required>
            </div>

            <!-- Confirmar senha -->
            <label class="form-label">Confirmar senha</label>
            <div class="input-group mb-3">
                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" name="confirmar" class="form-control" required>
            </div>

            <button class="btn btn-reset w-100">
                <i class="bi bi-check-circle me-1"></i>
                Alterar senha
            </button>

        </form>

    </div>
</div>

</body>
</html>
